name: Radio Tests

on:
  push:
    branches:
      - main
      - structural_realignment_propagation_ESPressio-Mesh
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout ESPressio System propagation branch
        run: git clone --depth 1 --branch structural_realignment_propagation_ESPressio-Mesh https://github.com/ESPressio-Development-Platform/ESPressio-System.git deps/System
      - name: Checkout ESPressio Observable structural_realignment
        run: git clone --depth 1 --branch structural_realignment https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git deps/Observable
      - name: Build transport tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_transport_tests.cpp -o radio_transport_tests -pthread
      - name: Run transport tests
        run: ./radio_transport_tests
      - name: Build RadioTransport deferred-evidence integration tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_transport_deferred_evidence_tests.cpp -o radio_transport_deferred_evidence_tests -pthread
      - name: Run RadioTransport deferred-evidence integration tests
        run: ./radio_transport_deferred_evidence_tests
      - name: Build direct-link evidence tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_direct_link_evidence_tests.cpp -o radio_direct_link_evidence_tests -pthread
      - name: Run direct-link evidence tests
        run: ./radio_direct_link_evidence_tests
      - name: Build send-attempt observer tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_send_attempt_observer_tests.cpp -o radio_send_attempt_observer_tests -pthread
      - name: Run send-attempt observer tests
        run: ./radio_send_attempt_observer_tests
      - name: Build deferred-transmission tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_deferred_transmission_tests.cpp -o radio_deferred_transmission_tests -pthread
      - name: Run deferred-transmission tests
        run: ./radio_deferred_transmission_tests
      - name: Build deferred logical-transfer aggregation tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_deferred_logical_transfer_tracker_tests.cpp -o radio_deferred_logical_transfer_tracker_tests -pthread
      - name: Run deferred logical-transfer aggregation tests
        run: ./radio_deferred_logical_transfer_tracker_tests
      - name: Build deferred logical-transfer observer bridge tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_deferred_observer_bridge_tests.cpp -o radio_deferred_observer_bridge_tests -pthread
      - name: Run deferred logical-transfer observer bridge tests
        run: ./radio_deferred_observer_bridge_tests
      - name: Build peer registry tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_peer_registry_tests.cpp -o radio_peer_registry_tests -pthread
      - name: Run peer registry tests
        run: ./radio_peer_registry_tests
      - name: Build clock synchronization protocol tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Itests/clock_stubs -Isrc -Ideps/System/src -Ideps/Observable/src tests/radio_clock_synchronizer_tests.cpp -o radio_clock_synchronizer_tests -pthread
      - name: Run clock synchronization protocol tests
        run: ./radio_clock_synchronizer_tests

  esp32-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create propagation worker, Event-bridge and clock-sync smoke project
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/espressio-radio-worker-ci"
          mkdir -p "$PROJECT/src"
          cat > "$PROJECT/platformio.ini" <<'EOF'
          [env:esp32dev]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17
          build_unflags = -std=gnu++11
          lib_ldf_mode = deep+
          lib_deps =
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment_propagation_ESPressio-Mesh
              https://github.com/ESPressio-Development-Platform/ESPressio-Task.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Event.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Radio.git#structural_realignment_propagation_ESPressio-Mesh
          EOF
          cat > "$PROJECT/src/main.cpp" <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Radio.hpp>
          #include <ESPressio_RadioEventBridge.hpp>

          class DummyRadio final : public ESPressio::Radio::IRadio {
          public:
              bool Start() override { started = true; return true; }
              void Stop() noexcept override { started = false; }
              bool IsStarted() const noexcept override { return started; }
              ESPressio::Radio::RadioCapabilities Capabilities() const noexcept override {
                  return {
                      ESPressio::Radio::RadioCapability::HardwareAddressing |
                      ESPressio::Radio::RadioCapability::ReceiveTimestamp,
                      32, 1, 4096
                  };
              }
              ESPressio::Radio::RadioAddress LocalAddress() const noexcept override {
                  const uint8_t value = 1;
                  return ESPressio::Radio::RadioAddress::FromBytes(&value, 1);
              }
              ESPressio::Radio::RadioSendResult Send(
                  const ESPressio::Radio::RadioAddress&, const uint8_t*, std::size_t
              ) override { return ESPressio::Radio::RadioSendResult::Accepted(); }
              void SetReceiver(ESPressio::Radio::IRadioReceiver*) noexcept override {}
              void SetWorkSignal(ESPressio::Radio::IRadioWorkSignal*) noexcept override {}
              void DrainInbound() override {}
              ESPressio::Radio::RadioObserverSubscriptions& Observers() noexcept override { return observers; }
          private:
              bool started = false;
              ESPressio::Radio::RadioObserverSubscriptions observers;
          };

          class DummyTerminalObserver final : public ESPressio::Radio::ILogicalTransferTerminalObserver {
          public:
              void OnLogicalTransferTerminal(const ESPressio::Radio::LogicalTransferTerminalEvidence&) override {}
          };

          ESPressio::Radio::DeferredLogicalTransferTracker<2> deferredTransfers;
          DummyTerminalObserver terminalObserver;
          ESPressio::Radio::RadioTransport transport(deferredTransfers, terminalObserver);
          ESPressio::Radio::RadioPeerRegistry<> peers;
          ESPressio::Radio::RadioWorker worker(transport);
          ESPressio::Event::RadioEventBridge bridge;
          DummyRadio dummyRadio;
          ESPressio::Radio::RadioClockSynchronizer clockSynchronizer(dummyRadio);

          void setup() {
              ESPressio::Radio::RadioWorkerConfiguration configuration;
              configuration.IterationPeriodMilliseconds = 10;
              configuration.DesiredExecutionBudgetMilliseconds = 2;
              worker.Configure(configuration);
              worker.AddInterface(dummyRadio);
              bridge.Subscribe(transport);
              transport.Start();
              ESPressio::Radio::RadioClockSynchronizationConfig sync;
              sync.Mode = ESPressio::Radio::RadioClockSynchronizationMode::Reference;
              sync.RequireReceiveTimestamp = true;
              (void)clockSynchronizer.Initialize(sync);
          }

          void loop() {}
          EOF
      - name: Compile worker, peer registry, deferred aggregation, optional Event bridge and radio clock synchronizer against propagation APIs
        run: pio run -d "$RUNNER_TEMP/espressio-radio-worker-ci"
