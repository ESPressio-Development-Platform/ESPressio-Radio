name: Radio redesign contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  foundation-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout System substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-System.git deps/System
      - name: Checkout Task substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-Task.git deps/Task
      - name: Checkout Timing substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git deps/Timing
      - name: Checkout Units substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-Units.git deps/Units
      - name: Compile canonical Radio umbrella without predecessor dependencies
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Itests/host_arduino -Isrc -Ideps/System/src -Ideps/Task/src -Ideps/Timing/src -Ideps/Units/src
          tests/radio_canonical_umbrella_tests.cpp -o radio_canonical_umbrella_tests -pthread
      - name: Run canonical Radio umbrella contract
        run: ./radio_canonical_umbrella_tests
      - name: Build R7 foundation contracts without RTTI/exceptions
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc -Ideps/Timing/src tests/radio_redesign_foundation_tests.cpp -o radio_redesign_foundation_tests
      - name: Run R7 foundation contracts
        run: ./radio_redesign_foundation_tests
      - name: Build managed provider contract without RTTI/exceptions
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc -Ideps/Timing/src tests/radio_managed_provider_contract_tests.cpp -o radio_managed_provider_contract_tests
      - name: Run managed provider contract
        run: ./radio_managed_provider_contract_tests
      - name: Build compact Clock wire/capture contracts without RTTI/exceptions
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc -Ideps/Timing/src tests/radio_clock_wire_v1_tests.cpp -o radio_clock_wire_v1_tests
      - name: Run compact Clock wire/capture contracts
        run: ./radio_clock_wire_v1_tests
      - name: Build adaptive Clock coordinator contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Itests/host_arduino -Isrc -Ideps/System/src -Ideps/Timing/src -Ideps/Units/src
          tests/radio_clock_coordinator_tests.cpp -o radio_clock_coordinator_tests -pthread
      - name: Run adaptive Clock coordinator contracts
        run: ./radio_clock_coordinator_tests
      - name: Build System-backed Radio-local Q1 capacity contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Isrc -Ideps/System/src -Ideps/Timing/src tests/radio_capacity_redesign_tests.cpp -o radio_capacity_redesign_tests -pthread
      - name: Run Radio-local Q1 capacity contracts
        run: ./radio_capacity_redesign_tests
      - name: Build bounded v3 reassembly contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Isrc -Ideps/System/src -Ideps/Timing/src tests/radio_reassembly_redesign_tests.cpp -o radio_reassembly_redesign_tests -pthread
      - name: Run bounded v3 reassembly contracts
        run: ./radio_reassembly_redesign_tests
      - name: Build single-owner ingress router contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Isrc -Ideps/System/src -Ideps/Timing/src tests/radio_ingress_router_tests.cpp -o radio_ingress_router_tests -pthread
      - name: Run single-owner ingress router contracts
        run: ./radio_ingress_router_tests
      - name: Build R3 scheduler contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Isrc -Ideps/System/src -Ideps/Timing/src tests/radio_scheduler_redesign_tests.cpp -o radio_scheduler_redesign_tests -pthread
      - name: Run R3 scheduler contracts
        run: ./radio_scheduler_redesign_tests
      - name: Build cooperative domain runtime contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Isrc -Ideps/System/src -Ideps/Task/src -Ideps/Timing/src tests/radio_domain_runtime_tests.cpp -o radio_domain_runtime_tests -pthread
      - name: Run cooperative domain runtime contracts
        run: ./radio_domain_runtime_tests
      - name: Build family-opaque Radio runtime facade contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -Itests/host_arduino -Isrc -Ideps/System/src -Ideps/Task/src -Ideps/Timing/src -Ideps/Units/src
          tests/radio_runtime_tests.cpp -o radio_runtime_tests -pthread
      - name: Run family-opaque Radio runtime facade contracts
        run: ./radio_runtime_tests
