name: Radio redesign contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  foundation-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout System substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-System.git deps/System
      - name: Build R7 foundation contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc tests/radio_redesign_foundation_tests.cpp -o radio_redesign_foundation_tests
      - name: Run R7 foundation contracts
        run: ./radio_redesign_foundation_tests
      - name: Build managed provider contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc tests/radio_managed_provider_contract_tests.cpp -o radio_managed_provider_contract_tests
      - name: Run managed provider contract
        run: ./radio_managed_provider_contract_tests
      - name: Build Radio-local Q1 capacity contracts
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -fno-exceptions
          -Isrc -Ideps/System/src tests/radio_capacity_redesign_tests.cpp -o radio_capacity_redesign_tests -pthread
      - name: Run Radio-local Q1 capacity contracts
        run: ./radio_capacity_redesign_tests
