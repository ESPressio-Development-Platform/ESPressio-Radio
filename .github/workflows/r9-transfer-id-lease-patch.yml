name: R9 transfer-id lease seam patch

on:
  push:
    branches: [primitives_redesign]
    paths:
      - .github/workflows/r9-transfer-id-lease-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
      - name: Apply bounded transfer-id lease seam
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/r9_patch.py
          python3 /tmp/r9_patch.py
          git diff --check
          git diff -- src/ESPressio_RadioScheduler.hpp src/ESPressio_RadioRuntime.hpp
          git config user.name 'ESPressio Work Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ESPressio_RadioScheduler.hpp src/ESPressio_RadioRuntime.hpp
          git commit -m 'Add bounded Radio transfer-id lease seam'
          git push origin HEAD:primitives_redesign
