name: R9 runtime submit compatibility patch

on:
  push:
    branches: [primitives_redesign]
    paths:
      - .github/workflows/r9-runtime-submit-compat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
      - name: Patch scheduler submit compatibility
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/r9_runtime_compat.py
          python3 /tmp/r9_runtime_compat.py
          git diff --check
          git config user.name 'ESPressio Work Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ESPressio_RadioRuntime.hpp
          git commit -m 'Preserve legacy scheduler submit compatibility'
          git push origin HEAD:primitives_redesign
