name: R9 Radio transfer-id lease contract

on:
  push:
    branches: [primitives_redesign]
    paths:
      - src/ESPressio_RadioScheduler.hpp
      - src/ESPressio_RadioRuntime.hpp
      - tests/radio_transfer_id_lease_tests.cpp
      - .github/workflows/r9-transfer-id-lease-contract.yml
  pull_request:
    paths:
      - src/ESPressio_RadioScheduler.hpp
      - src/ESPressio_RadioRuntime.hpp
      - tests/radio_transfer_id_lease_tests.cpp
      - .github/workflows/r9-transfer-id-lease-contract.yml

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout System substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-System.git deps/System
      - name: Checkout Timing substrate
        run: git clone --depth 1 --branch primitives_redesign https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git deps/Timing
      - name: Build transfer-id lease contract
        run: g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti -Isrc -Ideps/System/src -Ideps/Timing/src tests/radio_transfer_id_lease_tests.cpp -o radio_transfer_id_lease_tests -pthread
      - name: Run transfer-id lease contract
        run: ./radio_transfer_id_lease_tests
